apply plugin: 'com.android.application'
//apply plugin: 'com.google.gms.google-services'
//apply plugin: 'com.google.firebase.crashlytics'

android {
    signingConfigs {
        release {
            storeFile file("$project.rootDir/keystores/CanZeKeyStore.jks")
            storePassword 'canze4us!'
            keyAlias = 'canze-upload'
            keyPassword 'canze4us!'
        }
    }
    compileSdk 34

    defaultConfig {
        applicationId "cz.mtrakal.canze"
        minSdkVersion 29
        versionName '1.68'
        versionCode 103
    }
    buildTypes {
        release {
            //  minifyEnabled false
            //  minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        //debug {
        //    minifyEnabled true
        //    proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        //}
    }
    flavorDimensions = ["edition"]
    productFlavors {
        playstore {
            dimension "edition"
        }
        fdroid {
            dimension "edition"
        }
    }
    defaultConfig {

        targetSdk 33
        buildConfigField "long", "TIMESTAMP", System.currentTimeMillis() + "L"
        buildConfigField "String", "BRANCH", "\"" + "debug" + "\""
        signingConfig signingConfigs.release
    }
    namespace 'lu.fisch.canze'
    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'TypographyFractions'
    }
    buildFeatures {
        buildConfig true
    }
}

